# Model catalog for localtagger.
#
# Adding a new model is a config change, not a code change: append an entry here
# (and, if it needs a new inference path, a backend under app/backends/). The
# `family` field selects which backend runs the model:
#   wd14      -> imgutils.tagging.get_wd14_tags   (ONNX, auto-downloaded)
#   pixai     -> imgutils.tagging.get_pixai_tags  (ONNX, auto-downloaded)
#   camie     -> imgutils.tagging.get_camie_tags  (ONNX, auto-downloaded)
#   animetimm -> timm + safetensors               (gated, needs HF_TOKEN)
#
# `group` is the display heading the frontend groups models under (e.g. all
# WD-family taggers sit beneath "WD Tagger v3"). `label` is the short
# architecture name shown inside that group; `description` is the one-liner.
# These three drive a two-level picker:  group -> label (description).
#
# `default: true` marks a model as enabled out-of-the-box. The ENABLED_MODELS
# env var (comma-separated ids) overrides this set when provided.
#
# Per-tag `category` for animetimm: 0=general, 4=character, 9=rating.

models:
  # --- WD Tagger v3 ----------------------------------------------------------
  - id: wd-eva02-large-v3
    group: WD Tagger v3
    label: EVA02
    description: the best wd tagger
    family: wd14
    repo: SmilingWolf/wd-eva02-large-tagger-v3
    model_name: EVA02_Large
    gated: false
    recommended: true
    default: true
    default_threshold: 0.35
    default_character_threshold: 0.85

  - id: wd-swinv2-v3
    group: WD Tagger v3
    label: SwinV2
    description: fast and balanced wd
    family: wd14
    repo: SmilingWolf/wd-swinv2-tagger-v3
    model_name: SwinV2_v3
    gated: false
    recommended: false
    default: true
    default_threshold: 0.35
    default_character_threshold: 0.85

  - id: pixai-v0.9
    group: WD Tagger v3
    label: Pixai v0.9
    description: wd eva02 but broader and inconsistent
    family: pixai
    repo: pixai-labs/pixai-tagger-v0.9
    model_name: v0.9
    gated: false
    recommended: false
    default: true
    default_threshold: 0.35
    default_character_threshold: 0.85

  # --- Animetimm dbv4 --------------------------------------------------------
