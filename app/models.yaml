    group: Animetimm dbv4
    label: MobileNetV4
    description: mini instant tagger
    family: animetimm
    repo: Mooshie/mobilenetv4_conv_aa_large.dbv4-full
    model_name: ""
    gated: false
    recommended: false
    default: true
    default_threshold: 0.35
    default_character_threshold: 0.85

  - id: animetimm-swinv2-base
    group: Animetimm dbv4
